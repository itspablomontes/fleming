services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: dev
    command: sh -c "cd /workspace/apps/backend && air -c .air.toml"
    volumes:
      - ./apps/backend:/workspace/apps/backend
      - ./pkg:/workspace/pkg
      - ./go.work:/workspace/go.work
      - ./go.work:/workspace/go.work
      - ./go.work.sum:/workspace/go.work.sum
      - deployments:/workspace/deployments
    working_dir: /workspace/apps/backend
    environment:
      - ENV=dev
    env_file:
      - .env

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: [ "anvil" ]
    command: [ "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337" ]
    ports:
      - "8545:8545"
    networks:
      - fleming-net
    healthcheck:
      test: [ "CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 || exit 1" ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  contracts-deploy:
    image: ghcr.io/foundry-rs/foundry:latest
    profiles:
      - contracts
    working_dir: /workspace/contracts
    volumes:
      - ./:/workspace
      - deployments:/workspace/output
    depends_on:
      anvil:
        condition: service_healthy
    user: root
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "forge script script/DeployFleming.s.sol --rpc-url http://anvil:8545 --broadcast -vvvv && cp deployments.json /workspace/output/deployments.json" ]
    env_file:
      - .env
    networks:
      - fleming-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "pnpm config set store-dir /pnpm-store && pnpm install && until wget -q -O - http://backend:8080/health >/dev/null 2>&1; do echo 'waiting for backend...'; sleep 1; done && pnpm dev --host"
    ports:
      - "${HOST_WEB_DEV_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - pnpm_store:/pnpm-store
    environment:
      - WATCH_MODE=true
      - BACKEND_URL=http://backend:8080
      - CI=true
      - PNPM_HOME=/pnpm-store
  # Add top-level volumes to ensure persistence and isolation
volumes:
  pnpm_store:
  deployments:
