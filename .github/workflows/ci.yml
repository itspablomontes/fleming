name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # Change Detection (to avoid overlapping CI)
  # ------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # paths-filter relies on git history to compute changes reliably (merge-base on PRs).
          fetch-depth: 0

      - name: Detect contract-related changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - "contracts/**"
              - "pkg/protocol/chain/**"

  # ------------------------------------------------------------------
  # Frontend Checks
  # ------------------------------------------------------------------
  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: './apps/web/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck and Build
        run: pnpm build

  # ------------------------------------------------------------------
  # Contracts Checks (Foundry)
  # ------------------------------------------------------------------
  contracts-check:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Soldeer dependencies
        run: forge soldeer install
        working-directory: ./contracts

      - name: Show Forge version
        run: forge --version

      - name: Export contract ABIs (drift guard)
        run: bash contracts/script/export-abis.sh

      - name: Ensure ABI JSON is up to date
        run: git diff --exit-code -- pkg/protocol/chain/abi/FlemingAnchor.abi.json

      - name: Run Forge fmt
        run: forge fmt --check
        working-directory: ./contracts

      - name: Run Forge build
        run: forge build --sizes
        working-directory: ./contracts

      - name: Run Forge tests
        run: forge test -vvv
        working-directory: ./contracts

  # ------------------------------------------------------------------
  # Backend Checks
  # ------------------------------------------------------------------
  backend-check:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: "**/*.sum"

      - name: Download dependencies
        run: go mod download
        working-directory: ./apps/backend

      - name: Run Go Vet
        run: go vet ./...
        working-directory: ./apps/backend

      - name: Run Tests
        run: go test -v ./...
        working-directory: ./apps/backend

  # ------------------------------------------------------------------
  # Build and Push Docker Image (Backend)
  # ------------------------------------------------------------------
  build-and-push:
    needs: [backend-check, contracts-check]
    runs-on: ubuntu-latest
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.backend-check.result == 'success' &&
        (needs.contracts-check.result == 'success' || needs.contracts-check.result == 'skipped')
      }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ------------------------------------------------------------------
  # Deploy to VPS (CD)
  # ------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Deploy Directory (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ~/fleming/deploy

      - name: Copy Config files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/Caddyfile,deploy/compose.prod.yml,deploy/setup.sh"
          target: "~/fleming/deploy"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/fleming/deploy
            chmod +x setup.sh
            ./setup.sh
